<!doctype html>
<html ⚡ lang="id">
<head>
  <meta charset="utf-8">
  <title>Landing Page Kamu</title>
  <link rel="canonical" href="https://domainkamu.com/landing.html">
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
  
  <!-- Script Wajib AMP -->
  <script async src="https://cdn.ampproject.org/v0.js"></script>
  
  <style amp-custom>
    /* Styling CSS untuk tampilan */
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      text-align: center;
    }
    .header-logo {
      width: 100%;
      max-width: 300px;
      margin: 10px auto;
    }
    .banner {
      width: 100%;
      max-width: 500px;
      margin: 10px auto;
      border-radius: 8px;
    }
    .btn-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      flex: 1;
      padding: 12px 0;
      font-weight: bold;
      font-size: 16px;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      background: linear-gradient(180deg, #ff0000 0%, #8b0000 100%);
      border: 1px solid #ff4d4d;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn-full {
      display: block;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Logo Atas -->
  <div class="header-logo">
    <amp-img src="logo.png" width="300" height="80" layout="responsive" alt="Logo"></amp-img>
  </div>

  <!-- Banner Gambar Utama -->
  <div class="banner">
    <amp-img src="banner.jpg" width="500" height="500" layout="responsive" alt="Banner"></amp-img>
  </div>

  <!-- Tombol Navigasi (Daftar & Masuk) -->
  <div class="btn-container">
    <a href="https://villamakmur.site/register?referral_code=jp77" class="btn">DAFTAR</a>
    <a href="https://villamakmur.site/register?referral_code=jp77" class="btn">MASUK</a>
  </div>

  <!-- Tombol Live Chat -->
  <a href="https://link-livechat.com" class="btn btn-full">LIVECHAT</a>

</body>
</html>
